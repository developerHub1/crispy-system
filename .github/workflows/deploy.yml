name: Deploy to Oracle ARM VM

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and Deploy to ARM VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            # Navigate to maps directory
            cd ~/maps
            
            # Pull latest changes from git
            git pull
            
            # Install any dependency updates
            npm install --production
            
            # Deploy mapping infrastructure (Whole India ARM stack)
            npm run deploy:india:arm
